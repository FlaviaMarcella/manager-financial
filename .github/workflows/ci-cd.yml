name: CI/CD Pipeline - AWS Student Builder Group Finance

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Backend CI (Java 21 / Spring Boot 3)
  # ==========================================
  backend-test:
    name: Backend Test & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests
        working-directory: ./backend
        run: mvn clean test

  # ==========================================
  # 2. Frontend CI (Angular 21)
  # ==========================================
  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Angular Application
        working-directory: ./frontend
        run: npm run build -- --configuration production

  # ==========================================
  # 3. Docker Verification
  # ==========================================
  docker-check:
    name: Verify Docker Compose Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

  # ==========================================
  # 4. Continuous Deployment to AWS EC2
  # ==========================================
  deploy:
    name: Deploy to AWS EC2
    needs: [docker-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            USER_NAME="${{ secrets.EC2_USER || 'ubuntu' }}"
            if [ -d "/home/$USER_NAME/manager-financial" ]; then
              APP_DIR="/home/$USER_NAME/manager-financial"
            elif [ -d "/home/$USER_NAME/manager-financer" ]; then
              APP_DIR="/home/$USER_NAME/manager-financer"
            else
              APP_DIR="/home/$USER_NAME/manager-financial"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main
            
            # Ensure .env is present
            if [ ! -f .env ]; then
              echo "Creating .env from example..."
              cp .env.example .env
            fi
            
            # Restart containers with production profile
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            
            # Prune unused images to preserve Free Tier disk space
            docker image prune -af

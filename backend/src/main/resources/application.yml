server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: finance-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Application-specific properties
app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLTI1Ni1iaXQtc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9uLXNwcmluZy1ib290}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  google:
    client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id.apps.googleusercontent.com}
  initial-admin-email: ${INITIAL_ADMIN_EMAIL:admin@studentbuilder.aws}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost}
  storage:
    type: ${STORAGE_TYPE:local} # local or s3
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME:aws-student-builder-receipts}
      region: ${AWS_REGION:us-east-1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.aws.studentbuilder.finance: DEBUG
    org.springframework.security: INFO
